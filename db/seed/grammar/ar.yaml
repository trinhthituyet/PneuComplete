# Ngữ pháp mã hàng nhập tay — Regulator AR (modular, AR20-D … AR60-D)
#
# NGUỒN: DOCUMENT/FRL/es40-69-AC-D.pdf trang 100 ("Regulator AR20-D to AR60-D")
#   spine:  AR 30 … 03 BE … D    (markers q w e r t y)
#
# Đối chiếu mã thật trong BOM: AR30-03BE-D (×2), AR30-03B-D (×1)
#   AR30-03BE-D = AR · cỡ 30 · Rc · cửa 3/8 · B bracket · E square embedded gauge · series D
#   AR30-03B-D  = như trên nhưng không có đồng hồ
#
# GHI CHÚ: AR10 là dòng riêng, sơ đồ khác (DOCUMENT/FRL/ES40-60-AR10-A.pdf trang 1,
# hậu tố '-A' thay vì '-D'), chưa encode ở đây — BOM có AR10-M5BG-N-A ×2.

series_catalog_id: AR-D-E
create_series:
  code: "AR-D"
  name: "Regulator (modular, AR20-D to AR60-D)"
  category_slug: "air-preparation-equipment"
part_prefix: "AR"
source: "DOCUMENT/FRL/es40-69-AC-D.pdf trang 100"
entered_by: manual

slots:
  - pos: 1
    name: size
    value_type: enum
    separator: ""
    options:
      - {code: "20", label: "AR20", attrs: {ar_size: 20, port_sizes: ["1/8", "1/4"]}}
      # BỎ cỡ 25: bảng How to Order của thế hệ -D (tr100) chỉ có 20/30/40/50/60.
      # 'AR25-B' CÓ THẬT nhưng là thế hệ -B, mà tệp này khai series_suffix: D —
      # để lại thì engine sinh 'AR25-…-D', một mã lai hai thế hệ.
      - {code: "30", label: "AR30", attrs: {ar_size: 30, port_sizes: ["1/4", "3/8"]}}
      - {code: "40", label: "AR40", attrs: {ar_size: 40, port_sizes: ["1/4", "3/8", "1/2"]}}
      - {code: "50", label: "AR50", attrs: {ar_size: 50, port_sizes: ["3/4", "1"]}}
      - {code: "60", label: "AR60", attrs: {ar_size: 60, port_sizes: ["3/4", "1"]}}

  - pos: 2
    name: backflow
    value_type: enum
    separator: ""
    is_required: 0
    options:
      - {code: "Nil", label: "Without backflow function", attrs: {backflow: false}, requires: {size: ["20", "30", "40", "50", "60"]}}
      - {code: "K",   label: "With backflow function",    attrs: {backflow: true}, requires: {size: ["20", "30", "40", "50", "60"]}}

  - pos: 3
    name: thread_type
    # Gạch nối KHÔNG đặt ở đây. Ô này is_required=0 nên khi ren = Rc (mã Nil) cả
    # ô bị bỏ, MANG THEO dấu gạch — sinh ra 'AR3003BE-D' thay vì 'AR30-03BE-D'.
    # Đặt gạch ở port_size (ô luôn có mặt) thì cả hai dạng đều đúng:
    #     Rc  → AR30 + '' + -03 + BE + -D = AR30-03BE-D
    #     NPT → AR30 + N  + -03 + BE + -D = AR30N-03BE-D
    value_type: enum
    separator: ""
    is_required: 0
    options:
      - {code: "Nil", label: "Rc",  attrs: {port_standard: "Rc"}, requires: {size: ["20", "30", "40", "50", "60"]}}
      - {code: "N",   label: "NPT", attrs: {port_standard: "NPT"}, requires: {size: ["20", "30", "40", "50", "60"]}}
      - {code: "F",   label: "G",   attrs: {port_standard: "G"}, requires: {size: ["20", "30", "40", "50", "60"]}}

  - pos: 4
    name: port_size
    value_type: enum
    separator: "-"
    options:
      - {code: "01", label: "1/8", attrs: {port_size: "1/8"}, requires: {size: ["20"]}}
      - {code: "02", label: "1/4", attrs: {port_size: "1/4"}, requires: {size: ["20", "30", "40"]}}
      - {code: "03", label: "3/8", attrs: {port_size: "3/8"}, requires: {size: ["30", "40"]}}
      - {code: "04", label: "1/2", attrs: {port_size: "1/2"}, requires: {size: ["40"]}}
      - {code: "06", label: "3/4", attrs: {port_size: "3/4"}, requires: {size: ["40", "50"]}}
      - {code: "10", label: "1",   attrs: {port_size: "1"}, requires: {size: ["50", "60"]}}

  - pos: 5
    name: mounting
    value_type: enum
    separator: ""
    is_required: 0
    options:
      - {code: "Nil", label: "Without mounting option",        attrs: {mounting_opt: none}, requires: {size: ["20", "30", "40", "50", "60"]}}
      - {code: "B",   label: "With bracket",                   attrs: {mounting_opt: bracket}, requires: {size: ["20", "30", "40", "50", "60"]}}
      - {code: "H",   label: "With set nut (for panel mount)",  attrs: {mounting_opt: set_nut}, requires: {size: ["20", "30", "40"]}}

  - pos: 6
    name: pressure_gauge
    value_type: enum
    separator: ""
    is_required: 0
    options:
      - {code: "Nil", label: "Without pressure gauge",  attrs: {gauge: none}}
      - {code: "E",   label: "Square embedded type pressure gauge", attrs: {gauge: square_embedded}}
      - {code: "G",   label: "Round type pressure gauge (with limit indicator)", attrs: {gauge: round}}
      - {code: "J",   label: "Right angle square type pressure gauge", attrs: {gauge: right_angle}}
      - {code: "M",   label: "Round type pressure gauge (with color zone)", attrs: {gauge: color_zone}}

  - pos: 7
    name: series_suffix
    value_type: enum
    separator: "-"
    options:
      - {code: "D", label: "series D (giá trị cố định)"}
