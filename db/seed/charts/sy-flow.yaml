# Dẫn nạp âm (sonic conductance) của van SY — dùng để engine TỰ CHỌN CỠ VAN
# thay vì bắt người dùng khai `valve_series_size`.
#
# ── NGUỒN ────────────────────────────────────────────────────────────────────
chart_id: sy_sonic_conductance
title: "Dẫn nạp âm C của van SY3000/5000/7000 (Type 10/11/12)"
source:
  catalog: DOCUMENT/MAINFOLD/7-1-2-p0387-0722-SY_en.pdf
  pdf_page: 43
  table: "Flow rate characteristics — cột C [dm3/(s·bar)], chiều 1→4/2"
  note: >
    Catalog ghi ngay trên bảng: "Calculation of effective area S and sonic
    conductance C: S = 5.0 x C". Đây là quan hệ do HÃNG công bố, không phải suy diễn.

# ── ĐỌC THẬN TRỌNG — phải hiểu trước khi dùng ────────────────────────────────
# Bảng trong PDF GỘP HÀNG: các model SY_100/_200/_300/_400/_500 nằm chung nhóm và
# số C chỉ in một lần cho cả nhóm. Trích tự động thì không biết chắc số nào thuộc
# model nào. Ví dụ đọc được ở trang 43:
#     SY3100 SY3200 SY3300 → 1.3 ;  SY3500 → 1.4
#     SY5100 SY5200 SY5300 → 3.1 ;  SY5500 → 3.4
#     SY7300 → 4.8 ; SY7400 → 4.8 ; SY7500 → 7.1 ; (2→3) → 4.4
#
# QUYẾT ĐỊNH: lấy giá trị NHỎ NHẤT đọc được của mỗi cỡ. Sai theo hướng này chỉ
# khiến engine chọn van TO HƠN mức cần — không bao giờ nhỏ hơn. Chọn van nhỏ quá
# thì sụt áp khi nhiều xy-lanh chạy cùng lúc, sửa rất tốn; chọn to hơn chỉ tốn
# tiền và vẫn chạy được.
#
# ⚠ CẦN NGƯỜI XÁC NHẬN: mở trang 43 đối chiếu từng model. Sau khi xác nhận thì
# tách thành từng model riêng và nâng confidence lên 0.95.
needs_review: true
confidence: 0.6
digitized_by: "trích bằng pdftotext -bbox-layout, chưa người đối chiếu, 2026-08-21"

axis:
  x: { name: valve_series_size, unit: "" }
  y: { name: sonic_conductance_C, unit: "dm3/(s·bar)" }

# Bậc thang, KHÔNG nội suy: cỡ van là rời rạc, nội suy giữa SY3000 và SY5000 cho
# ra một con số không ứng với sản phẩm nào.
kind: discrete
series:
  - label: capacity
    points:
      - [SY3000, 1.3]
      - [SY5000, 3.1]
      - [SY7000, 4.4]

# ── CÁCH ENGINE DÙNG ─────────────────────────────────────────────────────────
# ISO 6358 định nghĩa C sao cho ở chế độ chảy tắc (choked/sonic), lưu lượng quy
# về điều kiện chuẩn: q [dm3/s ANR] = C × p1 [bar abs].
#   → Q_max [L/min ANR] = 60 × C × (áp_suất_MPa × 10 + 1.013)
# Ở 0.5 MPa: Q_max = 360.8 × C → SY3000 ≈ 469 · SY5000 ≈ 1119 · SY7000 ≈ 1588 L/min
#
# ĐÂY LÀ TRẦN LÝ THUYẾT (chảy tắc), không phải lưu lượng làm việc thực tế. Engine
# so lưu lượng CẦN CẤP (đã nhân hệ số đồng thời trong form, mặc định 1.5) với trần
# này rồi chọn cỡ NHỎ NHẤT thoả — hệ số đồng thời chính là phần bù cho chênh lệch
# giữa trần lý thuyết và thực tế.
formula:
  q_max_lpm_anr: "60 * C * (pressure_mpa * 10 + 1.013)"
  reference: "ISO 6358 — định nghĩa dẫn nạp âm C ở chế độ chảy tắc"
