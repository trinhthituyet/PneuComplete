# Họ nào ĐƯỢC số hoá. Họ ngoài danh sách này phải trả về 0 đường (C9).
in_scope_kinds: [flow_outlet, flow_drop, pressure_char]

# ── VÒNG B: HỌ SỤT ÁP, KHÔNG CÓ NHÃN ĐỌC ĐƯỢC ───────────────────────────────
# Mỗi ô vẽ 5 đường (tr92: 3) ứng với các ÁP VÀO P1 khác nhau. Nhãn viết XOAY bên
# trong ô và pdftotext tách thành ký tự rời — 'P','1','=','0','.3','MP','a' — nên
# KHÔNG có nguồn text nào đọc lại được cho chắc. Không gán nhãn theo phỏng đoán.
#
# Thay vào đó ghi ĐƯỜNG BAO TRÊN (sụt áp lớn nhất trong các P1 đã vẽ). Bảo thủ
# đúng hướng, giống cách đã làm với dẫn nạp âm SY: thừa sụt áp → engine chọn cỡ
# TO HƠN mức cần, chứ không bao giờ nhỏ hơn.
#
# Mốc neo vật lý thay cho C4: sụt áp = 0 khi lưu lượng = 0. Mọi đường phải bắt
# đầu ở gốc. Sai hiệu chuẩn hay lẫn khung/lưới là lệch mốc này ngay.
drop_family_note: >
  đường bao trên của các áp vào P1 đã vẽ; nhãn P1 là text xoay, pdftotext tách
  rời nên không đọc lại được — không gán nhãn theo phỏng đoán

# ── DUNG SAI VƯỢT KHUNG — ĐO ĐƯỢC, KHÔNG CHỌN CHO VỪA ───────────────────────
# Nét vẽ tràn qua trục một ít ở CẢ HAI đầu. Đo trên CẢ BA trang flow_outlet
# (22, 103, 128 — 17 ô, 50+ đường):
#   vượt trái 0,46%   ·   vượt phải 1,09%   ·   vượt Y 0,0020 MPa
#
# LÀ NÉT VẼ, KHÔNG PHẢI LỖI HIỆU CHUẨN. Ba căn cứ:
#   · C3 và C4 xác nhận tỉ lệ trục đúng (x_max khớp 100%, điểm đầu trùng nhãn Y)
#   · quy ra pixel thì mức vượt là HẰNG SỐ ~2px trên vùng vẽ rộng ~200px, nên
#     tính theo % thì lớn nhất ở ô có trục hẹp nhất (x_max=2000) — đúng như đo
#   · các đường vượt đều bắt đầu đúng nhãn Y và giảm đơn điệu → là dữ liệu
#
# Đặt 2% x_max và 0,02 MPa: gấp ~2 lần mức đo. Một đường KHUNG lệch tới 100%
# nên vẫn bị bắt.
#
# (Ghi lại vì đã đọc sai một lần: 'x lớn nhất=2022' với x_max=2000 tôi ghi là
#  +0,6%, thực ra +1,1%. Đó là lý do C6 fail ở lần chạy trước, không phải do bộ
#  số hoá.)
tolerance:
  x_frac_of_max: 0.02
  y_mpa: 0.02
  measured_worst_x_frac_low: 0.0046
  measured_worst_x_frac_high: 0.0109
  measured_worst_y_mpa: 0.0020

# ── TIÊU CHÍ PASS / FAIL ────────────────────────────────────────────────────
# Bộ số hoá phải đạt HẾT. Thiếu một tiêu chí là FAIL và KHÔNG được ghi YAML cho
# engine dùng — sai cỡ FRL là sụt áp khi nhiều xy-lanh chạy cùng lúc.
criteria:
  - id: C1-số-ô
    rule: "trích đúng 6 ô trên trang 22"
    fail_means: "gom ô sai → nhãn trục ô này áp cho đường cong ô kia"

  - id: C2-tiêu-đề
    rule: "6/6 ô gán đúng title theo thứ tự trên, mỗi title dùng MỘT lần"
    fail_means: "số liệu không gắn được vào model → vô dụng, hoặc gắn sai model"

  - id: C3-dải-trục-X
    rule: "x_max mỗi ô khớp bảng trên (sai số ≤ 2%)"
    fail_means: "sai tỉ lệ trục → mọi số lưu lượng sai theo"

  - id: C4-neo-áp-đặt
    rule: "≥ 90% đường cong bắt đầu (lưu lượng nhỏ nhất) đúng MỘT nhãn Y, ±0,025 MPa"
    fail_means: "sai transform hoặc sai hiệu chuẩn Y"

  - id: C5-đơn-điệu
    rule: "áp ra KHÔNG tăng khi lưu lượng tăng (cho phép nhiễu ≤ 0,02 MPa)"
    fail_means: "còn lẫn đường lưới/khung, hoặc nối sai đoạn"

  - id: C6-trong-khung
    rule: "mọi điểm nằm trong khung, theo dung sai `tolerance` đo được ở trên"
    fail_means: "đường ngoài khung là khung vẽ, không phải dữ liệu"

  - id: C7-tổng-quát
    rule: >
      CẢ BA trang họ flow_outlet (22, 103, 128) phải: đủ n_panels, đủ titles
      đúng thứ tự, và MỌI ô có ≥1 đường hợp lệ.
    fail_means: >
      chỉ canh được đúng một trang → hardcode. Đây là lớp lỗi 'mainY=380 cứng'
      đã phê phán ở prototype, chỉ đổi chỗ.

  - id: C8-phân-loại-họ
    rule: >
      mọi trang trích được ô phải nhận đúng kind theo bảng `pages`, và KHÔNG
      trang nào ngoài flow_outlet bị nhận thành flow_outlet.
    fail_means: >
      trộn họ đồ thị. Trang 23 từng báo '6/6 ô đạt' với trục X là áp vào —
      engine sẽ đọc áp suất thành lưu lượng.

  - id: C9-an-toàn
    rule: >
      trang có kind KHÔNG nằm trong `in_scope_kinds` phải trả về 0 đường
      (từ chối tường minh)
    fail_means: "số của họ chưa có ground truth lọt vào YAML"

  - id: C13-sụt-áp-đủ-ô
    rule: >
      cả 3 trang họ flow_drop (79, 92, 119) phải đủ n_panels, đủ titles đúng thứ
      tự, đúng x_max mỗi ô (≤2%), và MỖI ô có đúng curves_per_panel đường.
    fail_means: >
      thiếu đường thì đường bao trên bị hụt → engine ước sụt áp THẤP hơn thực tế
      → chọn cỡ nhỏ quá. Sai theo hướng nguy hiểm.

  - id: C14-neo-gốc
    rule: "mọi đường sụt áp bắt đầu ở gốc: lưu lượng ≤2% dải, sụt áp ≤5% dải"
    fail_means: >
      sai hiệu chuẩn, hoặc còn lẫn khung/lưới. Đây là mốc neo VẬT LÝ của họ này,
      thay cho C4 của họ áp ra.

  - id: C15-sụt-áp-tăng
    rule: "sụt áp KHÔNG giảm khi lưu lượng tăng"
    fail_means: "nối sai đoạn, hoặc lẫn đường của họ đồ thị khác"

  - id: C19-độ-ổn-định-điều-áp
    rule: >
      mọi ô họ áp-vào→áp-ra: đúng n_panels, mỗi ô đúng MỘT đường, đọc được điều
      kiện thử khớp `condition`, và áp ra nằm trong ±25% mức đặt trên toàn dải
      áp vào.
    fail_means: >
      thiếu điều kiện thử thì số vô nghĩa (trôi 0,03 MPa ở 20 L/min không nói gì
      về 2000 L/min). Áp ra trôi quá mức đặt nghĩa là đọc nhầm sang đồ thị khác.

  - id: C18-cỡ-cửa
    rule: >
      MỌI ô lưu lượng→áp ra đọc được cỡ cửa; 6 ô trang 22 khớp cột `port` trong
      `panels` (tôi đọc tay từ vòng A); và trong cùng họ mã, cỡ cửa KHÔNG giảm
      khi cỡ thân tăng.
    fail_means: >
      đồ thị lưu lượng được ĐO Ở MỘT CỠ CỬA. Lắp cửa nhỏ hơn thì số lưu lượng
      thành lạc quan — sụt áp thật nhiều hơn đồ thị. Đọc sai cỡ cửa là engine kết
      luận sai mà không có dấu hiệu gì.

  - id: C17-bao-trên-đơn-điệu
    rule: >
      ĐƯỜNG BAO TRÊN sẽ ghi ra YAML (pdf_chart.envelope) phải tăng đơn điệu, bắt
      đầu ở gốc, và chỉ tới x_common — chỗ MỌI đường còn định nghĩa.
    fail_means: >
      ngoài x_common, "max" chỉ còn max của MỘT SỐ điều kiện nên nó GIẢM khi lưu
      lượng tăng — đo được AF20-D từ 0,1 MPa ở 736 L/min xuống 0,079 ở 1500. Số
      đó vào engine là ước sụt áp THẤP hơn thực tế, sai theo hướng nguy hiểm.
      Tiêu chí này kiểm ĐÚNG hàm mà bộ sinh YAML dùng, không phải bản nhân đôi.

  - id: C16-đơn-điệu-liên-model-sụt-áp
    rule: >
      trong cùng họ mã (AF/AL/AFM/AFD), cỡ lớn hơn phải có sụt áp ≤ cỡ nhỏ hơn
      tại cùng lưu lượng (dung sai 0,005 MPa).
    fail_means: "gán tiêu đề lẫn giữa các ô, hoặc trộn số giữa ô"

  - id: C10-đủ-hai-họ
    rule: >
      MỌI ô của cả 3 trang phải có đủ hai họ áp vào với đúng tập áp đặt ở
      `inlet_families`, mỗi áp đặt xuất hiện MỘT lần trong họ của nó.
    fail_means: >
      hai đường cùng nhãn thì tra ra số của điều kiện nào là ngẫu nhiên; thiếu
      một họ thì im lặng mất dữ liệu. Cả hai đã thật sự xảy ra.

  - id: C11-áp-đặt-dưới-áp-vào
    rule: "mọi đường có áp đặt ≤ áp vào của họ nó — không điều áp LÊN được"
    fail_means: "ghép kiểu nét ↔ áp vào bị ngược"

  - id: C12-đơn-điệu-liên-model
    rule: >
      trong cùng một họ mã (AC/AR/AW) và cùng điều kiện, cỡ lớn hơn phải giữ áp
      ra ≥ cỡ nhỏ hơn tại cùng lưu lượng (dung sai 0,02 MPa).
    fail_means: >
      gán tiêu đề lẫn giữa các ô, hoặc trộn số của ô này sang ô khác. Đây là
      kiểm chứng vật lý ĐỘC LẬP với mọi tiêu chí trong một ô.

