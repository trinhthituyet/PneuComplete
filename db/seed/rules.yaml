# Luật kỹ thuật dạng chạy được — nạp vào bảng `rule`.
#
# Khác với rules.example.yaml (bản phác thảo có templating {{ }}), file này dùng
# tập biểu thức tối giản mà engine/rules.py đánh giá được thật:
#   when.all[]        : {attr: <tên>, eq|ne|gte|lte|in: <giá trị>}
#   then.need         : yêu cầu 1 dòng BOM
#     from_series     : catalog_id của series dùng để sinh mã
#     qty             : số nguyên, hoặc {from_ctx: <khoá>} lấy từ ngữ cảnh
#     want            : ràng buộc truyền cho engine/generate.py
#         giá trị {from_ctx: k} / {from_project: k} được thay bằng giá trị thật
#     mate            : {role: <role của item nguồn>} — kết quả phải ghép được
#     item_vn         : tên vật tư tiếng Việt — hiện ở dòng BOM khi CHƯA CÓ MÃ
#     node_type       : loại node trên SƠ ĐỒ mà vật tư này chiếm chỗ
#   then.warn         : chỉ sinh cảnh báo, không sinh dòng BOM
#
# VÌ SAO CÓ node_type: sơ đồ phải liệt kê MỌI vật tư, kể cả chưa có mã. Trước đây
# engine/tree.py suy loại node từ `layer` bằng một bảng ba dòng, nên:
#   · van, manifold, gasket, end plate CÙNG layer 'valve' → không phân biệt được,
#     và fill_codes() đã điền mã VAN (SY5220-5MZE-C6) vào node MANIFOLD vì tầng
#     valve lúc đó chỉ có một dòng. Sơ đồ hiện mã sai, không phải chỉ thiếu.
#   · floating joint (layer 'actuator'), đầu nối, ống, bộ AC không có dòng nào
#     trong bảng đó nên KHÔNG BAO GIỜ xuất hiện trên sơ đồ.
# Chính luật biết nó sinh ra vật tư gì, nên nó khai — không suy ngược từ layer.
#
# MỌI luật BẮT BUỘC có rationale: nó hiện lên UI cho người dùng đọc và tự phán xét.

- code: R-SPD-01
  name: Speed controller cho xy-lanh tác động 2 chiều
  scope: per_actuator
  priority: 10
  when:
    all:
      - {attr: acting, eq: double}
  then:
    need:
      layer: accessory
      node_type: speed_controller
      item_vn: "Tiết lưu (speed controller)"
      # AS1-E = họ Push-lock (hậu tố A). BOM máy thật của bạn dùng loại này
      # (AS2201F-01-06SA ×8, AS1201F-M5-06A ×24), không phải loại núm thường.
      from_series: {from_project: speed_controller_series}
      # Mặc định = số cửa khí (2 với xy-lanh 2 chiều) nhưng KHAI ĐƯỢC theo từng
      # xy-lanh: golden test cho thấy BOM 23-432 có 24 cái trong khi 2/xy-lanh ra
      # 26 — có cơ cấu chỉ tiết lưu một chiều, hoặc tốc độ chiều kia không cần
      # điều chỉnh. Engine không suy được điều đó từ mã xy-lanh.
      qty: {from_project: speed_controller_per_actuator}
      qty_default: {from_ctx: port_count}
      want:
        control: meter_out
        shape: {from_project: speed_controller_shape}
        port_size: {from_ctx: port_size}
        tube_od_mm: {from_project: tube_od_mm}
        sealant: {from_project: sealant}
        knob: {from_project: speed_controller_knob}
      # sealant chỉ là SỞ THÍCH: cỡ M5 không có loại sealant (ghi chú catalog AS),
      # gặp cỡ đó thì bỏ yêu cầu và ghi chú, không báo gap.
      want_soft: [sealant]
      mate: {role: air_port}
  rationale: >
    Xy-lanh tác động 2 chiều cần tiết lưu khí xả ở cả hai cửa để tốc độ ổn định.
    Meter-out là mặc định vì tránh giật ở đầu hành trình. Cỡ ren của speed
    controller phải bằng cỡ cửa của xy-lanh — engine tra từ bore, không giả định.
    Cỡ ren và cỡ ống lấy ĐÚNG theo xy-lanh, không chọn lớn hơn — bạn xác nhận:
    "Hãy chọn theo thông số tối thiểu, thường tôi sẽ chọn size lớn hơn cho Cylinder
    thôi, các thiết bị khác chọn theo tiêu chuẩn dùng cho cylinder đó."
  source: Nguyên tắc chung SMC Best Pneumatics; cỡ cửa từ PDF CM2 trang 14 cột P;
          họ push-lock từ PDF AS1-E trang 7; xác nhận của người dùng 2026-08-18

- code: R-SW-01
  name: Cảm biến từ cho xy-lanh có nam châm
  scope: per_actuator
  priority: 20
  when:
    all:
      - {attr: has_magnet, eq: true}
      # KHÔNG đặt riêng nếu mã xy-lanh đã kèm cảm biến. Golden test bắt lỗi này:
      # BOM dùng MGPM25-200Z-M9BL / CDQSB20-25D-M9BZ — hậu tố -M9Bx nghĩa là
      # cảm biến đi kèm theo xy-lanh, nên BOM không có dòng D-M9 riêng. Engine
      # đề xuất thêm 18 cái là THỪA.
      - {attr: auto_switch, eq: null}
  then:
    need:
      layer: electrical
      node_type: sensor
      item_vn: "Cảm biến từ (auto switch)"
      from_series: D-M9-CM2-E
      qty: 2
      want:
        wiring: {from_project: switch_wiring}
        indicator: {from_project: switch_indicator}
        lead_wire_m: {from_project: switch_lead_wire_m}
        entry: grommet
        water_resistant: false
      mate: {role: switch_rail}
  rationale: >
    Hậu tố D trong mã (CDM2…) nghĩa là xy-lanh có nam châm sẵn — phải có cảm biến
    từ mới xác nhận được vị trí, bắt buộc với máy tự động. 2 cái cho 2 đầu hành trình.
    Chỉ đặt riêng khi mã xy-lanh CHƯA kèm cảm biến. Nếu mã đã có hậu tố kiểu
    '-M9BW' thì cảm biến tính trong đơn xy-lanh, đặt thêm là mua trùng.
  source: Ô auto_switch trong sơ đồ How to Order PDF CM2 trang 6; danh sách switch
          lắp được lấy từ bảng Applicable Auto Switches cùng trang

- code: R-TUBE-01
  name: Ống khí theo đầu one-touch của speed controller
  scope: per_system
  priority: 60
  when:
    all:
      - {attr: open_onetouch_count, gte: 1}
  then:
    need:
      layer: piping
      node_type: tubing
      from_series: TU-E
      qty: {from_ctx: tube_rolls_needed}
      unit: cuộn
      per_tube_od: true
      requires_input: tube_total_m
      item_vn: "Ống khí (TU)"
      want:
        tube_od_mm: {from_project: tube_od_mm}
        color: {from_project: tube_color}
        roll_length_m: {from_project: tube_roll_length_m}
  rationale: >
    Mọi đầu one-touch còn hở phải được nối bằng ống đúng đường kính. Nhưng TỔNG SỐ MÉT
    ống thì engine KHÔNG suy được — nó phụ thuộc layout từng máy, khoảng cách từ tủ van
    tới từng xy-lanh. Bản trước tôi lấy mặc định 3 m/mối nối; người dùng bác bỏ ở mục
    A3-5: "tuỳ từng máy, tôi cần lựa chọn theo nhu cầu từng máy, chỗ này ko tự động ra
    kết quả được". Nên giờ engine ĐÒI người dùng khai `tube_total_m`, chưa khai thì báo
    gap kèm số đầu nối cần đi ống để người dùng ước lượng.

- code: R-VLV-01
  name: Van điện từ 5/2 cho xy-lanh 2 chiều trong máy tự động
  scope: per_actuator
  priority: 30
  when:
    all:
      - {attr: acting, eq: double}
      - {attr: automation, eq: true}
  then:
    need:
      layer: valve
      node_type: valve
      item_vn: "Van điện từ"
      from_series: SY-5-E
      qty: 1
      requires_input: valve_function
      want:
        series_size: {from_project: valve_series_size}
        positions:   {from_project: valve_positions}
        solenoid:    {from_project: valve_solenoid}
        center:      {from_project: valve_center}
        mounting: {from_project: valve_mounting}
        voltage: {from_project: voltage}
        entry: {from_project: valve_entry}
        light: true
        surge: true
        override: {from_project: valve_override}
        tube_od_mm: {from_project: tube_od_mm}
      want_soft: [tube_od_mm, override]
  rationale: >
    Mỗi xy-lanh cần một van điều khiển. LOẠI van do bạn khai theo chức năng cơ cấu:
    single (kẹp/đẩy một chiều) · double (đi-về, giữ vị trí khi mất điện) ·
    3pos_closed/exhaust/pressure (dừng được ở giữa hành trình).
    Cặp 2 chữ số trong mã quyết định kiểu cửa: 20 = body ported (van có cửa
    one-touch riêng, đi ống trực tiếp tới xy-lanh), 40 = base mounted (cắm lên
    manifold, không có cửa riêng). BOM máy 23-432 dùng cả hai: SY5120/5220/5420-5MZE-C6
    body ported ø6, và SY7140-5LZE-02 base mounted.
    Cỡ van (SY3000/5000/7000/9000) phụ thuộc lưu lượng cần thiết — catalog cho Cv
    dạng bảng nhưng engine chưa trích, nên ĐÒI bạn khai `valve_series_size`.
    LOẠI van cũng phải khai (`valve_function`) và khai được RIÊNG cho từng xy-lanh:
    golden test trên máy 23-432 cho thấy một máy dùng đồng thời single, double và
    3-position — phụ thuộc chức năng cơ cấu (kẹp / đi-về / dừng giữa) mà engine
    không thể suy từ mã xy-lanh. Bản trước mặc định "mọi xy-lanh → 5/2 double" nên
    sai 6/11 dòng van.
  source: DOCUMENT/MAINFOLD/7-1-2-p0723-0963-SY3000_en.pdf trang 10 + 26

- code: R-FRL-01
  name: Bộ xử lý khí nguồn (FRL / Air Combination)
  scope: per_system
  priority: 70
  when:
    all:
      - {attr: actuator_count, gte: 1}
  then:
    need:
      layer: air_prep
      node_type: frl
      from_series: {from_project: frl_series}
      qty: 1
      requires_input: main_line_port_size
      item_vn: "Bộ xử lý khí FRL (AC)"
      want:
        port_size:      {from_project: main_line_port_size}
        port_standard:  {from_project: thread_standard}
        size:           {from_project: frl_size}
        has_lubricator:     {from_project: frl_lubricator}
        has_mist_separator: {from_project: frl_mist_separator}
        gauge:          {from_project: frl_gauge}
        auto_drain:     {from_project: frl_auto_drain}
        # thế hệ -D có thêm: kiểu ra dây của digital switch, và van xả áp dư
        entry:          {from_project: frl_gauge_entry}
        output:         {from_project: frl_gauge_output}
        relief_valve:   {from_project: frl_relief_valve}
      want_soft: [entry, relief_valve, auto_drain, gauge, output]
  rationale: >
    Cỡ FRL phải chọn theo tổng tiêu thụ khí, KHÔNG theo cỡ cửa xy-lanh — chọn thiếu
    gây sụt áp khi nhiều xy-lanh chạy cùng lúc. Nhưng catalog AC chỉ cho lưu lượng
    dưới dạng ĐỒ THỊ (Flow Characteristics), không phải bảng số, nên engine không
    kiểm được bằng máy. Vì vậy engine đòi bạn khai cỡ cửa đường trục chính
    (`main_line_port_size` — từ 2026-08-25 engine TỰ suy từ cỡ cửa mà đồ thị lưu
    lượng được đo ở, xem R-FRL-02); nếu cỡ đó có ở nhiều cỡ AC thì engine liệt kê các cỡ
    ứng viên để bạn chọn thay vì tự đoán. Số liệu duy nhất đọc được dạng số là
    "Rated flow [AFM]" của biến thể C/D: AC20C=200, AC25C=450, AC30C=450,
    AC40C=1100 L/min (trang 23) và AC20D=150, AC30D=330, AC40D=800 (trang 27) —
    nhưng đó là lưu lượng riêng bộ tách sương, không phải cả bộ.
  source: PDF 7-8-3-p0651-0739-AC-A_en.pdf trang 8/18 (sơ đồ), 9 (cỡ cửa), 23+27 (rated flow)

- code: V-FRL-FLOW-01
  name: Không kiểm được lưu lượng FRL bằng dữ liệu catalog
  scope: per_system
  priority: 220
  when:
    all:
      - {attr: frl_proposed, eq: true}
      # CHỈ khi chưa kiểm được. Đồ thị đã số hoá (db/seed/charts/ac-flow.yaml) nên
      # phần lớn trường hợp engine kiểm được — vẫn nói "engine không kiểm được,
      # bạn tự mở PDF trang 10" là nói sai với người dùng.
      - {attr: frl_flow_checked, eq: false}
  then:
    warn:
      severity: warn
      code: FRL_FLOW_UNVERIFIED
      message: Cỡ FRL chọn theo cỡ cửa, CHƯA kiểm được lưu lượng — thiếu ÁP NGUỒN
               của xưởng nên engine không tra được đồ thị
  rationale: >
    Đồ thị "lưu lượng → áp ra" của catalog FRL ĐÃ số hoá
    (db/seed/charts/ac-flow.yaml, qua cổng tests/test_chart.py), nên engine tra được
    — nhưng chỉ khi biết ÁP NGUỒN của xưởng: đồ thị có hai họ đường theo áp vào
    (0,7 và 1,0 MPa) cho số khác nhau, và không điều áp LÊN được nên áp vào phải
    ≤ áp nguồn. Khai áp nguồn ở cấu hình thì engine tự kiểm và tự chọn cỡ, kèm
    số liệu; chưa khai thì phải tự đối chiếu đồ thị Flow Rate Characteristics
    trong catalog (es40-69-AC-D.pdf trang 22).

- code: V-FLOW-01
  name: Cảnh báo ống nhỏ so với tốc độ piston
  scope: per_actuator
  priority: 200
  when:
    all:
      - {attr: piston_speed_mm_s, gte: 300}
      - {attr: tube_od_mm, lte: 6}
  then:
    warn:
      severity: warn
      code: TUBE_UNDERSIZED
      message: Tốc độ piston cao với ống nhỏ — cân nhắc tăng cỡ ống
  rationale: >
    Tổn thất áp trên ống tỉ lệ với chiều dài và bình phương lưu tốc. Ống ø6 ở tốc độ
    trên 300 mm/s với hành trình dài gây sụt áp đáng kể.

- code: V-THREAD-01
  name: Phát hiện cặp ren không lắp được với nhau trong BOM
  scope: per_system
  priority: 210
  when:
    all:
      - {attr: incompatible_thread_pairs, gte: 1}
  then:
    warn:
      severity: error
      code: MIXED_THREAD_STANDARD
      message: BOM có nhiều chuẩn ren — kiểm tra lại, ren R/Rc/G/NPT không lắp lẫn an toàn
  rationale: >
    Ren Rc/G/NPT khác góc ren và bước nên không lắp lẫn được an toàn dù đường kính
    danh nghĩa giống nhau. Đây là nguyên nhân rò khí phổ biến. Lưu ý: R male vào Rc
    female là ĐÚNG và cố ý (chuẩn ISO 7/JIS) — luật chỉ báo khi có cặp thật sự
    không tương thích, không báo chỉ vì BOM có nhiều tên chuẩn ren.

- code: R-MFD-01
  name: Gộp van rời thành manifold
  scope: per_system
  priority: 65
  when:
    all:
      - {attr: valve_count, gte: 3}
      - {attr: use_manifold, eq: true}
  then:
    need:
      layer: valve
      node_type: manifold
      item_vn: "Đế manifold"
      from_series: SS5Y-20-E
      qty: 1
      want:
        series_size: {from_project: valve_series_size}
        mfd_type:    {from_project: manifold_mfd_type}
        stations:    {from_ctx: valve_count}
        port_standard: {from_project: thread_standard}
      want_soft: [port_standard]
  rationale: >
    Từ 3 van cùng series trở lên, dùng manifold rẻ và gọn hơn van rời: chung một
    đường cấp, một đầu nối điện, giảm số fitting và ống. Nhưng chọn sai đế manifold
    thì toàn bộ cụm van không lắp được, nên engine không đoán.
    LƯU Ý (golden test phát hiện): manifold dùng được với CẢ van body-ported —
    máy 23-432 có SS5Y5-20-12 cùng van SY5120-5MZE-C6 (body ported). Bản trước tôi
    ràng buộc `valve_mounting = base_mounted` nên bỏ sót gasket và end plate.
    Số station = số van. Catalog ghi rõ số station "cũng tính cả blanking plate", nên
    nếu bạn để chỗ trống dự phòng thì phải tự tăng số station lên.
    PHẠM VI: chỉ Type 20 (body ported, bar stock, individual wiring). Các kiểu đi dây
    khác (D-sub, serial transmission, SV unit như SS5Y5-10SVA của máy 24-236) chưa
    encode — engine sẽ báo không sinh được thay vì đoán.
  source: PDF 7-1-2-p0387-0722-SY_en.pdf (chưa giải mã xong)

- code: R-JOINT-01
  name: Floating joint cho đầu cần xy-lanh
  scope: per_actuator
  priority: 40
  when:
    all:
      - {attr: acting, eq: double}
      # ĐÃ BỎ hai điều kiện từng có ở đây:
      #  · has_guide=false — tôi suy diễn "MGP/CQS có dẫn hướng sẵn nên không cần
      #    joint", golden test chứng minh SAI (BOM vẫn dùng JA30-10-125).
      #  · rod_end_thread != null — làm luật IM LẶNG bỏ qua khi series chưa có dữ
      #    liệu ren đầu cần. Im lặng tệ hơn báo gap.
      # ĐIỀU KIỆN THẬT: chỉ xy-lanh có ĐẦU CẦN REN NGOÀI mới lắp được floating
      # joint. Xy-lanh ren trong (mặc định) thì joint không có gì để vặn vào.
      # Kiểm chứng trên BOM 23-432: CDQSL25-100DCM ×4 + CDQSG25-250DCM ×1 — cả hai
      # có option M (rod end male) — và BOM có đúng JA30-10-125 ×5.
      # CM2 thì mặc định ĐÃ là ren ngoài (sơ đồ: 'Nil = Male rod end') nên vẫn áp.
      # MGP là guide cylinder: đầu ra là tấm dẫn hướng, không phải cần ren, nên
      # không áp luật này (BOM cũng không có joint cho MGP).
      - {attr: rod_end_thread_male, ne: null}
  then:
    need:
      layer: actuator
      node_type: joint
      item_vn: "Khớp nối mềm (floating joint)"
      from_series: J-E
      qty: 1
      want:
        rod_end_thread: {from_ctx: rod_end_thread_male}
      confidence_cap: 0.6
  rationale: >
    Floating joint bù lệch tâm giữa cần xy-lanh và tải, tránh phá gioăng và cần.
    Bạn xác nhận: "Đa số trường hợp là xài Floating Join, nhưng không phải tất cả
    trường hợp" — nên engine ĐỀ XUẤT với độ tin cậy thấp (0.6) chứ không khẳng định,
    và bạn tự bỏ ở những chỗ tải đã được dẫn hướng cứng. BOM thật dùng JA30-10-125
    (5 cái) và JB20-5-080-X11 (4 cái).
  source: BOM máy 23-432 và 24-236; xác nhận của người dùng 2026-08-18

- code: R-MFD-GASKET-01
  name: Gasket cho van cắm manifold
  scope: per_system
  priority: 66
  when:
    all:
      - {attr: valve_count, gte: 1}
      - {attr: use_manifold, eq: true}
  then:
    need:
      layer: valve
      node_type: manifold_part
      item_vn: "Gasket đế manifold"
      from_parts: SY-5-E
      qty: {from_ctx: valve_count}
      want:
        role: gasket
        series_size: {from_project: valve_series_size}
  rationale: >
    Mỗi van cắm lên manifold cần một gasket làm kín giữa van và đế. Đặt van riêng
    KHÔNG kèm gasket — catalog ghi rõ "When ordering a valve individually, the base
    gasket is not included". BOM máy 23-432 có SY5000-GS-1 ×12 cho 11 van.
  source: DOCUMENT/MAINFOLD/7-1-2-p0723-0963-SY3000_en.pdf trang 45, 51

- code: R-MFD-ENDPLATE-01
  name: End plate cho manifold
  scope: per_system
  priority: 67
  when:
    all:
      - {attr: valve_count, gte: 2}
      - {attr: use_manifold, eq: true}
  then:
    need:
      layer: valve
      node_type: manifold_part
      item_vn: "End plate đế manifold"
      from_parts: SY-5-E
      qty: 2
      requires_input: manifold_type
      want:
        role: end_plate
        series_size: {from_project: valve_series_size}
        manifold_type: {from_project: manifold_type}
  rationale: >
    Manifold cần 2 end plate bịt hai đầu (đầu cấp khí và đầu cuối). Mã end plate phụ
    thuộc KIỂU manifold: Type 20/23 dùng SY5000-26-20A còn Type 20P/23P dùng
    SY5000-26-21A — chọn sai thì không lắp được. Engine đòi bạn khai `manifold_type`
    vì kiểu manifold do bạn quyết định (cách đi dây, cách gá), không suy được từ
    danh sách xy-lanh. BOM máy 23-432 dùng SY5000-26-20A ×4 (Type 20).
  source: DOCUMENT/MAINFOLD/7-1-2-p0723-0963-SY3000_en.pdf trang 73

- code: R-VLV-02
  name: Chọn cỡ van theo lưu lượng — engine tự tính
  # Luật này thực thi trong engine/bom.py (lượt tính trước), không phải bằng
  # when/then, vì nó cần TỔNG lưu lượng của mọi actuator — mà luật per_actuator
  # chạy trước khi biết tổng. Dòng này tồn tại để: (1) rule_code hợp lệ với khoá
  # ngoại project_output.rule_code, (2) lý do hiện ra trong UI như mọi dòng khác.
  # Điều kiện không bao giờ đúng nên nó không tự kích hoạt.
  scope: per_system
  priority: 998
  when:
    all:
      - {attr: __never__, eq: true}
  then: {}
  rationale: >
    Cỡ van suy từ lưu lượng cần cấp, không hỏi người dùng. Dùng dẫn nạp âm C
    trong db/seed/charts/sy-flow.yaml (trích từ catalog SY trang 43): ISO 6358
    định nghĩa ở chế độ chảy tắc q[dm3/s ANR] = C × p1[bar abs], nên
    Q_max = 60 × C × (áp_suất_MPa × 10 + 1,013). Engine chọn cỡ NHỎ NHẤT thoả
    lưu lượng cần cấp (đã nhân hệ số đồng thời).
    Bảng C đang ở trạng thái needs_review vì bảng trong PDF gộp hàng — đã lấy giá
    trị NHỎ NHẤT của mỗi cỡ, sai theo hướng đó chỉ chọn van to hơn cần chứ không
    bao giờ nhỏ hơn. Ngoài dải đã số hoá thì báo gap, KHÔNG ngoại suy.
  source: DOCUMENT/MAINFOLD/7-1-2-p0387-0722-SY_en.pdf trang 43; ISO 6358

- code: R-FRL-02
  name: Chọn cỡ AC theo lưu lượng — engine tự tính
  # Thực thi trong engine/bom.py (lượt tính trước) như R-VLV-02, vì cần TỔNG lưu
  # lượng của mọi actuator. Dòng này tồn tại để rule_code hợp lệ với khoá ngoại
  # project_output.rule_code và để lý do hiện ra trong UI. Điều kiện không bao
  # giờ đúng nên không tự kích hoạt.
  #
  # Mã RIÊNG, không dùng chung R-FRL-01: R-FRL-01 báo thiếu cỡ CỬA đường trục,
  # đây là chọn CỠ THÂN theo lưu lượng — hai vấn đề khác nhau, và dùng chung mã
  # thì mọi chỗ chọn gap theo rule_code sẽ bắt lẫn nhau.
  scope: per_system
  priority: 997
  when:
    all:
      - {attr: __never__, eq: true}
  then: {}
  rationale: >
    Cỡ AC suy từ tổng lưu lượng cần cấp + áp nguồn của xưởng, không hỏi người
    dùng. Tra db/seed/charts/ac-flow.yaml — đồ thị "lưu lượng → áp ra" trích tự
    động từ vector PDF và đã qua cổng 12 tiêu chí + 7 đối chứng âm
    (tests/test_chart.py).
    Bộ điều áp luôn SỤT áp khi có lưu lượng nên "áp ra ≥ áp đặt" là bất khả:
    engine đặt điều áp lên BẬC KẾ TIẾP trên áp làm việc (bậc 0,1 MPa là khoảng
    giữa các đường catalog vẽ, không phải hằng số tự đặt), rồi chọn cỡ NHỎ NHẤT
    còn giữ được ≥ áp làm việc tại lưu lượng thật.
    Cần áp nguồn vì đồ thị có HAI họ đường theo áp vào (0,7 và 1,0 MPa) cho số
    khác nhau, mà không điều áp LÊN được nên áp vào phải ≤ áp nguồn. Thiếu áp
    nguồn thì báo gap ở đúng trường đó, KHÔNG chọn bừa một họ.
    Ngoài dải đã số hoá thì báo gap, KHÔNG ngoại suy.
  source: >
    DOCUMENT/FRL/es40-69-AC-D.pdf trang 22 (AC), 103 (AR), 128 (AW);
    ground truth db/seed/charts/_groundtruth-ac.yaml

- code: R-FIT-01
  name: Đầu nối one-touch cho điểm nối ống → ren
  # Thực thi trong engine/bom.py, không bằng when/then: số điểm nối là DANH SÁCH
  # người dùng khai, không suy được từ actuator. Điều kiện không bao giờ đúng.
  scope: per_system
  priority: 996
  when:
    all:
      - {attr: __never__, eq: true}
  then: {}
  rationale: >
    Engine KHÔNG suy được SỐ LƯỢNG đầu nối. Đo trên hai máy thật: tỉ lệ cút vuông
    trên mỗi thiết bị là 1,42 và 2,74 — chênh gấp đôi; trên mỗi tiết lưu là 0,84 và
    2,00. Không có tỉ lệ nào ổn định để suy.
    Lý do cấu trúc: van dùng cửa one-touch (C6) và tiết lưu AS…F đã có one-touch
    sẵn, nên đoạn van↔xy-lanh KHÔNG cần đầu nối rời. Toàn bộ cút và chữ Y thuộc
    MẠNG PHÂN PHỐI KHÍ, mà cách đi ống thật không được ghi ở đâu engine thấy được.
    Nên phân công: bạn khai ĐIỂM NỐI (bạn biết layout máy), engine chọn ĐÚNG MÃ —
    đó mới là chỗ hay sai. Mã sinh ra được kiểm bằng ràng buộc đọc từ 1.366 mã KQ2
    mà catalog liệt kê, nên không sinh tổ hợp không tồn tại.
  source: >
    Đo trên BOM thật 2 máy; ràng buộc mã từ DOCUMENT/FITTING/es50-37-kq2.pdf

- code: R-PARSE-00
  name: Mã hàng không đọc được
  # Không tự kích hoạt — engine gọi trực tiếp khi materialize() thất bại.
  scope: per_system
  priority: 999
  when:
    all:
      - {attr: __never__, eq: true}
  then: {}
  rationale: >
    Mã không khớp ngữ pháp nào đang có. Hai cách xử lý: sửa lại mã, hoặc bật
    "Mã tự do" cho node đó để vẫn đưa vào BOM mà không qua kiểm tra kỹ thuật.
    Engine không đoán ý mã sai vì đoán sai là mua sai hàng.
  source: engine/bom.py — nhánh materialize() thất bại
