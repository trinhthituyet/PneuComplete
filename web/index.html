<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PneuComplete — cây dự án khí nén → BOM</title>
<style>
/* Tự chứa: không thư viện, không CDN, không font ngoài. */
:root{
  --bg:#0D0F13; --panel:#151821; --panel2:#1C202B; --hover:#20242F;
  --line:#262B37; --line-soft:#1E222C;
  --tx:#E8EAF0; --dim:#8D95A8; --faint:#565D6D;
  --ok:#35D4AA; --ok-bg:#173C33; --warn:#F0A947; --warn-bg:#3A2D14;
  --err:#F2637A; --err-bg:#3A1B22; --acc:#6E8CFF; --acc-bg:#1B2440;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* màu theo layer — dùng chung cho cây, sơ đồ và BOM */
  --l-actuator:#6ED89A; --l-valve:#B490F0; --l-air_prep:#5FCBEE;
  --l-piping:#F0A947; --l-accessory:#F0A947; --l-electrical:#F2637A;
  --l-other:#8D95A8;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --hover:#e9ecf1;
         --line:#dfe3e8; --line-soft:#eaedf1; --tx:#1b1f27; --dim:#5d6673;
         --faint:#8a93a1; --acc:#0b66d0; --acc-bg:#e5eefb; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;
       background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.brand-name{font-weight:600;font-size:14px}
.brand-sub{font-size:11px;color:var(--faint);font-family:var(--mono)}
.ring-wrap{display:flex;align-items:center;gap:10px}
.ring-legend{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim)}
.lrow{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.lrow b{color:var(--tx);font-family:var(--mono);font-weight:500}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--panel2);padding:3px;
      border-radius:8px;border:1px solid var(--line)}
.tab{padding:6px 15px;font-size:12.5px;font-weight:500;color:var(--dim);
     border-radius:6px;cursor:pointer;user-select:none}
.tab.active{background:var(--acc-bg);color:var(--acc)}
.tab:hover:not(.active){color:var(--tx)}
button{cursor:pointer;font:inherit;background:var(--acc);color:#fff;border:none;
       padding:7px 12px;border-radius:6px;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);
             font-weight:400;padding:4px 10px;font-size:12px}
button.ghost:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:var(--tx);background:var(--panel2);
             border:1px solid var(--line);border-radius:5px;padding:6px 9px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.mono{font-family:var(--mono)}
.hint{font-size:11px;color:var(--dim);margin-top:3px}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;
      border:1px solid var(--line);color:var(--dim)}
.body{display:flex;flex:1;min-height:0}

/* ── cây ─────────────────────────────────────────────────────────────────── */
.treepanel{width:330px;flex-shrink:0;background:var(--panel);
           border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ttool{padding:9px 12px;border-bottom:1px solid var(--line-soft);display:flex;
       align-items:center;gap:7px}
.ttool-title{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.6px;
             text-transform:uppercase}
.tscroll{flex:1;overflow-y:auto;padding:8px 6px}
.nrow{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;
      cursor:pointer;font-size:13px}
.nrow:hover{background:var(--hover)}
.nrow.sel{background:var(--acc-bg)}
.caret{width:14px;flex-shrink:0;text-align:center;color:var(--dim);font-size:11px}
.caret.open{transform:rotate(90deg);color:var(--acc)}
.caret.leaf{visibility:hidden}
.tico{width:22px;height:18px;flex-shrink:0;border-radius:4px;display:flex;
      align-items:center;justify-content:center;font-size:9px;font-weight:700;
      font-family:var(--mono);background:var(--panel2)}
.nlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncode{font-family:var(--mono);font-size:10px;color:var(--faint);flex-shrink:0;
       max-width:96px;overflow:hidden;text-overflow:ellipsis}
.chip{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip.specified{background:var(--ok)} .chip.type_only{background:var(--warn)}
.chip.empty{background:var(--err)}
.kids{margin-left:18px;border-left:1px solid var(--line);padding-left:4px}
.kids.hid{display:none}

/* ── vùng chính ──────────────────────────────────────────────────────────── */
.main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.view{flex:1;overflow:auto;padding:20px 26px;display:none}
.view.active{display:block}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
   margin:0 0 9px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:11px 13px;margin-bottom:9px}
.crumb{font-size:11px;color:var(--faint);font-family:var(--mono);margin-bottom:6px}
.crumb span.go{cursor:pointer;text-decoration:underline dotted}
.dtitle{font-size:19px;font-weight:600;display:flex;align-items:center;gap:9px;
        flex-wrap:wrap;margin-bottom:14px}
.nameinp{background:transparent;border:none;border-bottom:1px dashed transparent;
         color:var(--tx);font:600 19px/1.3 inherit;padding:2px 0;min-width:150px}
.nameinp:hover,.nameinp:focus{border-bottom-color:var(--line);outline:none}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;
       font-family:var(--mono);text-transform:uppercase}
.badge.specified{background:var(--ok-bg);color:var(--ok)}
.badge.type_only{background:var(--warn-bg);color:var(--warn)}
.badge.empty{background:var(--err-bg);color:var(--err)}
.frow{display:grid;grid-template-columns:150px 1fr 22px;gap:10px;align-items:center;
      padding:8px 0;border-bottom:1px solid var(--line-soft)}
.frow:last-child{border-bottom:none}
.fname{font-size:13px;color:var(--dim)}
.frow input,.frow select{width:100%}
.xbtn{color:var(--faint);cursor:pointer;text-align:center}
.xbtn:hover{color:var(--err)}
.kidrow{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--panel2);
        border:1px solid var(--line);border-radius:6px;cursor:pointer;margin-bottom:5px}
.kidrow:hover{border-color:var(--acc)}
.kidrow .nm{flex:1;font-size:13px}
.kidrow .cd{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.addrow{display:flex;gap:7px;margin-top:8px;padding:10px;background:var(--panel2);
        border:1px dashed var(--line);border-radius:6px;align-items:center}
.addrow select{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--faint);text-transform:uppercase;
   letter-spacing:.5px;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.stat{display:flex;gap:10px;margin-bottom:14px}
.sbox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:12px 14px}
.snum{font-size:21px;font-weight:700;font-family:var(--mono)}
.slab{font-size:11.5px;color:var(--dim);margin-top:3px}
.alert{background:var(--err-bg);border:1px solid #5A2530;border-radius:8px;
       padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#F5A0AE}
.why{font-size:11.5px;color:var(--dim);margin-top:3px}
details summary{cursor:pointer;color:var(--faint);font-size:11px;margin-top:4px}
.diagwrap{overflow:auto;background:var(--panel);border:1px solid var(--line);
          border-radius:8px;padding:14px}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="brand-name">PneuComplete</div>
    <div class="brand-sub" id="sub">cây dự án → BOM</div>
  </div>
  <div class="ring-wrap">
    <svg width="44" height="44" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="18" fill="none" stroke="#1C202B" stroke-width="6"/>
      <circle id="rSpec" cx="22" cy="22" r="18" fill="none" stroke="#35D4AA" stroke-width="6"
        stroke-linecap="round" transform="rotate(-90 22 22)"/>
      <circle id="rTyp" cx="22" cy="22" r="18" fill="none" stroke="#F0A947" stroke-width="6"
        stroke-linecap="round" transform="rotate(-90 22 22)"/>
      <circle id="rEmp" cx="22" cy="22" r="18" fill="none" stroke="#F2637A" stroke-width="6"
        stroke-linecap="round" transform="rotate(-90 22 22)"/>
      <text id="rPct" x="22" y="26" text-anchor="middle" font-size="10.5"
        fill="currentColor" font-weight="600" font-family="monospace">0%</text>
    </svg>
    <div class="ring-legend">
      <div class="lrow"><span class="dot" style="background:#35D4AA"></span>Đã chốt mã <b id="cSpec">0</b></div>
      <div class="lrow"><span class="dot" style="background:#F0A947"></span>Mới biết loại <b id="cTyp">0</b></div>
      <div class="lrow"><span class="dot" style="background:#F2637A"></span>Trống <b id="cEmp">0</b></div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="tree">Cây dự án</div>
    <div class="tab" data-tab="cfg">Cấu hình</div>
    <div class="tab" data-tab="bom">BOM</div>
    <div class="tab" data-tab="diagram">Sơ đồ</div>
  </div>
  <button id="run">Dựng BOM</button>
  <button class="ghost" id="csv" disabled>CSV</button>
</header>

<div class="body">
  <div class="treepanel">
    <div class="ttool">
      <span class="ttool-title">Cấu trúc</span>
      <span style="margin-left:auto"></span>
      <button class="ghost" id="addStation">+ Trạm</button>
      <button class="ghost" id="undo" title="Ctrl+Z">↶</button>
    </div>
    <div class="tscroll" id="treeRoot"></div>
    <div class="ttool" style="border-top:1px solid var(--line-soft);border-bottom:none">
      <span class="hint" id="tstat"></span>
    </div>
  </div>
  <div class="main">
    <div class="view active" id="v-tree"></div>
    <div class="view" id="v-cfg"></div>
    <div class="view" id="v-bom"><div class="hint">Bấm <b>Dựng BOM</b>.</div></div>
    <div class="view" id="v-diagram"><div class="hint">Bấm <b>Dựng BOM</b> để sinh sơ đồ.</div></div>
  </div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;
  if(x!==undefined)e.textContent=x;return e;};
const SVGNS='http://www.w3.org/2000/svg';
const sv=(t,a={})=>{const e=document.createElementNS(SVGNS,t);
  for(const k in a) e.setAttribute(k,a[k]); return e;};

let DEF={}, NEEDS=[], VFUNC=[], GROUPS={}, PARENT_OF={}, SINGLETON=[];
let TREE=null, sel=null, seq=1, lastProject=null, expanded=new Set(), undoStack=[];
const ICON={frl:'FRL',manifold:'MFD',valve:'V',cylinder:'CY',speed_controller:'SC',
  regulator:'R',silencer:'SI',fitting:'F',tubing:'TU',sensor:'SN',plc:'PLC',custom:'?'};
const LAYER_VN={actuator:'ACTUATOR',valve:'VAN',air_prep:'XỬ LÝ KHÍ',piping:'ĐƯỜNG ỐNG',
  accessory:'PHỤ KIỆN',electrical:'ĐIỆN / CẢM BIẾN',other:'KHÁC'};
const LAYER_ORDER=['actuator','valve','air_prep','piping','accessory','electrical','other'];
const COND=[['pressure_mpa','Áp suất (MPa)'],['cycle_s','Chu kỳ (s)'],
  ['tube_od_mm','Ống ø (mm)'],['tube_color','Màu ống'],['tube_roll_length_m','Cuộn (m)'],
  ['voltage','Điện áp coil'],['safety_factor','Hệ số đồng thời']];

function* walk(n,p=null,d=0){ yield [n,p,d];
  for(const c of n.children||[]) yield* walk(c,n,d+1); }
const findN=id=>{ for(const [n] of walk(TREE)) if(n.id===id) return n; return null; };
const parentOf=id=>{ for(const [n,p] of walk(TREE)) if(n.id===id) return p; return null; };
const layerOf=t=>(GROUPS[t]||{}).layer||'other';
const statusOf=n=>n.code?'specified':(Object.keys(n.attrs||{}).length?'type_only':'empty');
function snap(){ undoStack.push(JSON.stringify({TREE,seq})); if(undoStack.length>50) undoStack.shift(); }
function undo(){ if(!undoStack.length) return; const d=JSON.parse(undoStack.pop());
  TREE=d.TREE; seq=d.seq; sel=null; render(); }

async function boot(){
  const d=await (await fetch('/api/defaults')).json();
  DEF=d.defaults; NEEDS=d.needs_input; VFUNC=d.valve_functions;
  const g=await (await fetch('/api/groups')).json();
  g.groups.forEach(x=>GROUPS[x.key]=x);
  PARENT_OF=g.parent_of||{}; SINGLETON=g.singleton||[];
  TREE={id:'n0',type:'frl',name:'Bộ xử lý khí (nguồn chung)',code:'',qty:1,attrs:{},children:[]};
  expanded.add('n0');
  buildCfg(); addStation(); render();
}

/* ── vẽ cây ─────────────────────────────────────────────────────────────── */
function render(){
  const r=$('#treeRoot'); r.innerHTML=''; r.appendChild(renderNode(TREE));
  renderDetail(); updateRing();
  let n=0,c=0; for(const [x] of walk(TREE)){ n++; if(x.code) c++; }
  $('#tstat').textContent=`${n} thiết bị · ${c} đã có mã`;
}
function renderNode(n){
  const wrap=el('div');
  const kids=n.children||[], open=expanded.has(n.id);
  const row=el('div','nrow'+(sel===n.id?' sel':''));
  row.onclick=e=>{e.stopPropagation(); sel=n.id; render();};
  const car=el('div','caret '+(kids.length?(open?'open':''):'leaf'),'▸');
  if(kids.length) car.onclick=e=>{e.stopPropagation();
    expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id); render();};
  row.appendChild(car);
  const ic=el('div','tico',ICON[n.type]||'?');
  ic.style.color=`var(--l-${layerOf(n.type)})`;
  row.appendChild(ic);
  row.appendChild(el('div','nlabel',n.name||(GROUPS[n.type]||{}).label||n.type));
  if(n.code) row.appendChild(el('div','ncode',n.code));
  row.appendChild(el('div','chip '+statusOf(n)));
  wrap.appendChild(row);
  if(kids.length){
    const kw=el('div','kids'+(open?'':' hid'));
    kids.forEach(c=>kw.appendChild(renderNode(c)));
    wrap.appendChild(kw);
  }
  return wrap;
}

/* ── panel chi tiết ─────────────────────────────────────────────────────── */
function allowedChildren(type){
  // Loại nào thêm được vào node này — lấy TỪ ENGINE (/api/groups → PARENT_OF),
  // KHÔNG hard-code ở UI. Thêm họ thiết bị mới chỉ sửa engine/tree.py.
  return Object.keys(PARENT_OF).filter(k=>(PARENT_OF[k].allowed||[]).includes(type));
}
function renderDetail(){
  const v=$('#v-tree'); const n=sel?findN(sel):TREE;
  if(!n){ v.innerHTML='<div class="hint">chưa chọn thiết bị</div>'; return; }
  v.innerHTML='';
  const g=GROUPS[n.type]||{};

  const path=[]; (function up(x){ const p=parentOf(x.id); if(p) up(p); path.push(x); })(n);
  const cb=el('div','crumb');
  path.forEach((x,i)=>{
    if(i===path.length-1) cb.appendChild(el('span',null,x.name||x.type));
    else { const s=el('span','go',x.name||x.type);
      s.onclick=()=>{sel=x.id;render();}; cb.appendChild(s);
      cb.appendChild(el('span',null,' / ')); }
  });
  v.appendChild(cb);

  const t=el('div','dtitle');
  const ni=el('input','nameinp'); ni.value=n.name||'';
  ni.onchange=()=>{snap(); n.name=ni.value; render();};
  t.appendChild(ni);
  const stt=statusOf(n);
  t.appendChild(el('span','badge '+stt,
    {specified:'Đã chốt mã',type_only:'Mới biết loại',empty:'Trống'}[stt]));
  t.appendChild(el('span','pill',g.label||n.type));
  if(n.filled_by_bom) t.appendChild(el('span','pill','engine chọn'));
  if(n.id!==TREE.id){
    const del=el('button','ghost','Xoá'); del.style.marginLeft='auto';
    del.onclick=()=>{snap(); const p=parentOf(n.id);
      p.children=p.children.filter(c=>c.id!==n.id); sel=p.id; render();};
    t.appendChild(del);
  }
  v.appendChild(t);

  const c1=el('div','card'); c1.appendChild(el('h2',null,'Mã hàng'));
  const rw=el('div','frow'); rw.appendChild(el('div','fname','model_code'));
  const box=el('div');
  const ci=el('input','mono'); ci.value=n.code||'';
  ci.placeholder='để trống → engine tự chọn'; ci.setAttribute('list','codes-'+n.type);
  ci.onchange=()=>{snap(); n.code=ci.value.trim(); delete n.filled_by_bom;
    checkCode(n,box); render();};
  box.appendChild(ci);
  box.appendChild(el('div','why'));
  rw.appendChild(box); rw.appendChild(el('div'));
  c1.appendChild(rw);
  c1.appendChild(el('div','hint',
    'Để TRỐNG nếu muốn engine tự chọn: cỡ van suy từ lưu lượng, tiết lưu suy từ cửa xy-lanh.'));
  v.appendChild(c1);
  loadCodes(n.type); if(n.code) checkCode(n,box);

  const c2=el('div','card'); c2.appendChild(el('h2',null,'Thông số'));
  const mk=(lab,inp)=>{const r=el('div','frow'); r.appendChild(el('div','fname',lab));
    r.appendChild(inp); r.appendChild(el('div')); c2.appendChild(r); return inp;};
  const qi=el('input'); qi.type='number'; qi.min=1; qi.value=n.qty||1;
  qi.onchange=()=>{snap(); n.qty=+qi.value||1; render();}; mk('qty',qi);
  if(n.type==='valve'){
    const vs=el('select'); vs.appendChild(new Option('(engine tự chọn)',''));
    VFUNC.forEach(f=>vs.appendChild(new Option(f,f)));
    vs.value=(n.overrides||{}).valve_function||'';
    vs.onchange=()=>{snap(); n.overrides=n.overrides||{};
      if(vs.value) n.overrides.valve_function=vs.value;
      else delete n.overrides.valve_function;};
    mk('Loại van (override)',vs);
  }
  if(n.type==='plc'){
    const vi=el('input'); vi.value=(n.attrs||{}).voltage||''; vi.placeholder='24VDC';
    vi.onchange=()=>{snap(); n.attrs=n.attrs||{}; n.attrs.voltage=vi.value;};
    mk('Điện áp ngõ ra',vi);
  }
  const lb=el('label'); lb.style.cssText='display:flex;gap:7px;align-items:center;font-size:12.5px;padding-top:9px';
  const cb2=el('input'); cb2.type='checkbox'; cb2.checked=!!n.manual;
  cb2.onchange=()=>{snap(); n.manual=cb2.checked; render();};
  lb.appendChild(cb2); lb.appendChild(el('span',null,'Mã tự do — ngoài catalog, không kiểm'));
  c2.appendChild(lb); v.appendChild(c2);

  const c3=el('div','card'); c3.appendChild(el('h2',null,'Thuộc tính đã biết'));
  const ks=Object.keys(n.attrs||{});
  if(!ks.length) c3.appendChild(el('div','hint','chưa có — khai được cả khi chưa biết mã'));
  ks.forEach(k=>{
    const r=el('div','frow');
    const ki=el('input'); ki.value=k;
    ki.onchange=()=>{snap(); const val=n.attrs[k]; delete n.attrs[k];
      n.attrs[ki.value]=val; render();};
    r.appendChild(ki);
    const vi=el('input'); vi.value=n.attrs[k];
    vi.oninput=()=>{n.attrs[k]=vi.value;};
    r.appendChild(vi);
    const x=el('div','xbtn','✕'); x.onclick=()=>{snap(); delete n.attrs[k]; render();};
    r.appendChild(x); c3.appendChild(r);
  });
  const ab=el('button','ghost','+ thuộc tính');
  ab.onclick=()=>{snap(); n.attrs=n.attrs||{};
    n.attrs['thuoc_tinh_'+(Object.keys(n.attrs).length+1)]=''; render();};
  c3.appendChild(ab); v.appendChild(c3);

  const c4=el('div','card');
  c4.appendChild(el('h2',null,`Thiết bị con — ${(n.children||[]).length}`));
  (n.children||[]).forEach(c=>{
    const r=el('div','kidrow');
    r.onclick=()=>{sel=c.id; expanded.add(n.id); render();};
    r.appendChild(el('div','chip '+statusOf(c)));
    r.appendChild(el('div','nm',c.name||c.type));
    r.appendChild(el('div','cd',c.code||'chưa có mã'));
    c4.appendChild(r);
  });
  const allow=allowedChildren(n.type);
  if(allow.length){
    const ar=el('div','addrow');
    const sl=el('select');
    allow.forEach(k=>sl.appendChild(new Option((GROUPS[k]||{}).label||k,k)));
    ar.appendChild(sl);
    const b=el('button','ghost','+ Thêm');
    b.onclick=()=>{
      const ty=sl.value;
      if(SINGLETON.includes(ty) && [...walk(TREE)].some(([x])=>x.type===ty)){
        $('#sub').textContent='chỉ nên có 1 '+ty+' — BOM thật dùng 1 manifold nhiều station';
        return; }
      snap();
      const k={id:'n'+(seq++),type:ty,name:(GROUPS[ty]||{}).label||ty,code:'',qty:1,
               attrs:{},children:[]};
      n.children=n.children||[]; n.children.push(k);
      expanded.add(n.id); sel=k.id; render();};
    ar.appendChild(b); c4.appendChild(ar);
    const why=(PARENT_OF[allow[0]]||{}).why;
    if(why) c4.appendChild(el('div','hint','Chỉ hiện loại lắp được vào đây. '+why));
  }
  v.appendChild(c4);
}

const codeCache={};
async function loadCodes(type){
  if(codeCache[type]){ putList(type); return; }
  try{
    const r=await (await fetch('/api/codes?group='+encodeURIComponent(type))).json();
    codeCache[type]=r.codes||[];
  }catch(e){ codeCache[type]=[]; }
  putList(type);
}
function putList(type){
  let dl=document.getElementById('codes-'+type);
  if(!dl){ dl=el('datalist'); dl.id='codes-'+type; document.body.appendChild(dl); }
  dl.innerHTML='';
  (codeCache[type]||[]).forEach(c=>{const o=el('option'); o.value=c; dl.appendChild(o);});
}
async function checkCode(n,box){
  const st=box.querySelector('.why'); if(!st) return;
  if(n.manual || !n.code){ st.textContent=''; return; }
  try{
    const r=await (await fetch('/api/parse?code='+encodeURIComponent(n.code))).json();
    if(r.ok){
      const a=r.attrs||{};
      const bits=Object.entries(a).filter(([k])=>!k.startsWith('_')).slice(0,4)
        .map(([k,v])=>`${k}=${v}`).join(' · ');
      st.innerHTML=`<span style="color:var(--ok)">✓ ${r.series||''}</span> ${bits}`;
    } else {
      const why=r.error||(r.unparsed?`chưa hiểu phần "${r.unparsed}"`:'')||'không hiểu mã';
      st.innerHTML=`<span style="color:var(--err)">✗ ${why}</span>`;
    }
  }catch(e){ st.textContent=String(e); }
}

/* Một TRẠM = một van + một xy-lanh. Nhập mã xy-lanh là đủ — engine suy phần còn
   lại (đo được: 1 mã xy-lanh + 5 giá trị mức dự án → 7 dòng BOM, 0 câu hỏi). */
function addStation(){
  snap();
  const mfd=[...walk(TREE)].map(([x])=>x).find(x=>x.type==='manifold');
  const host=mfd||TREE;
  const nv=(host.children||[]).filter(c=>c.type==='valve').length+1;
  const cyl={id:'n'+(seq++),type:'cylinder',name:'Xy-lanh',code:'',qty:1,attrs:{},children:[]};
  const valve={id:'n'+(seq++),type:'valve',name:'Trạm SV'+nv,code:'',qty:1,attrs:{},
               children:[cyl]};
  host.children=host.children||[]; host.children.push(valve);
  expanded.add(TREE.id); if(mfd) expanded.add(mfd.id); expanded.add(valve.id);
  sel=cyl.id; render();
}

/* ── cấu hình ───────────────────────────────────────────────────────────── */
function buildCfg(){
  const v=$('#v-cfg'); v.innerHTML='';
  const s1=el('div'); s1.appendChild(el('h2',null,'Cần bạn khai — engine không suy được'));
  NEEDS.forEach(n=>{
    const c=el('div','card');
    const r=el('div','frow'); r.appendChild(el('div','fname',n.label));
    let inp;
    if(n.key==='valve_function'){ inp=el('select');
      inp.appendChild(new Option('(engine tự chọn)',''));
      VFUNC.forEach(x=>inp.appendChild(new Option(x,x)));
    } else if(n.key==='manifold_type'){ inp=el('select');
      inp.appendChild(new Option('— để trống → gap',''));
      ['20, 23, 20SA, 23SA','20P, 23P'].forEach(x=>inp.appendChild(new Option('Type '+x,x)));
    } else if(n.key==='valve_piping'){ inp=el('select');
      [['onetouch','one-touch (C6/C8) — cắm ống trực tiếp'],
       ['thread','ren (01/02) — vặn đầu nối vào']].forEach(([a,b])=>inp.appendChild(new Option(b,a)));
    } else if(n.key==='fitting_shape'){ inp=el('select');
      [['straight','thẳng'],['elbow','vuông (chữ L)'],['tee','T']]
        .forEach(([a,b])=>inp.appendChild(new Option(b,a)));
    } else if(n.key==='exhaust_silencer'){ inp=el('select');
      [['true','có'],['false','không']].forEach(([a,b])=>inp.appendChild(new Option(b,a)));
    } else { inp=el('input'); inp.placeholder='để trống → engine báo gap'; }
    inp.dataset.k=n.key;
    if(inp.tagName==='SELECT' && DEF[n.key]!==undefined && DEF[n.key]!==null)
      inp.value=String(DEF[n.key]);
    r.appendChild(inp); r.appendChild(el('div'));
    c.appendChild(r); c.appendChild(el('div','hint',n.why));
    s1.appendChild(c);
  });
  v.appendChild(s1);
  const s2=el('div'); s2.appendChild(el('h2',null,'Điều kiện làm việc'));
  const c=el('div','card');
  COND.forEach(([k,lab])=>{
    const r=el('div','frow'); r.appendChild(el('div','fname',lab));
    const i=el('input'); i.dataset.c=k; i.value=DEF[k]??'';
    r.appendChild(i); r.appendChild(el('div')); c.appendChild(r);
  });
  s2.appendChild(c); v.appendChild(s2);
}
function collectConfig(){
  const cfg={};
  document.querySelectorAll('[data-k]').forEach(e=>{ if(e.value!=='') cfg[e.dataset.k]=e.value; });
  document.querySelectorAll('[data-c]').forEach(e=>{ if(e.value!=='') cfg[e.dataset.c]=e.value; });
  return cfg;
}

function updateRing(){
  let s=0,t=0,e=0;
  for(const [n] of walk(TREE)){ const st=statusOf(n);
    if(st==='specified')s++; else if(st==='type_only')t++; else e++; }
  const tot=s+t+e||1, C=2*Math.PI*18;
  const set=(id,len,off)=>{const x=document.getElementById(id);
    x.setAttribute('stroke-dasharray',`${len} ${C}`);
    x.setAttribute('stroke-dashoffset',`${-off}`);};
  const ls=C*s/tot, lt=C*t/tot, le=C*e/tot;
  set('rSpec',ls,0); set('rTyp',lt,ls); set('rEmp',le,ls+lt);
  $('#rPct').textContent=Math.round(100*s/tot)+'%';
  $('#cSpec').textContent=s; $('#cTyp').textContent=t; $('#cEmp').textContent=e;
}

/* ── dựng BOM ───────────────────────────────────────────────────────────── */
async function run(){
  $('#run').disabled=true; $('#sub').textContent='đang dựng…';
  try{
    const r=await (await fetch('/api/bom',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tree:TREE,config:collectConfig(),name:'cây dự án'})})).json();
    if(r.error){ $('#sub').innerHTML=`<span style="color:var(--err)">${r.error}</span>`; return; }
    lastProject=r.project_id; $('#csv').disabled=false;
    // Engine trả về CÂY đã chuẩn hoá + đã điền mã → dùng làm nguồn sự thật mới.
    if(r.tree){ TREE=r.tree; for(const [n] of walk(TREE)) expanded.add(n.id); }
    renderBom(r); renderDiagram(); render(); tab('bom');
    const fx=(r.tree_fixed||[]).length;
    $('#sub').textContent=`xong · #${r.project_id}`+(fx?` · đã dịch ${fx} thiết bị về đúng cha`:'');
  }catch(e){ $('#sub').innerHTML=`<span style="color:var(--err)">${e}</span>`; }
  finally{ $('#run').disabled=false; }
}

/* Vấn đề hiện theo 3 phần: sai ở đâu · cần sửa gì · sửa thế nào.
   Chi tiết dài (catalog, Cv, số trang) gập trong <details>. */
function problemCard(x,color){
  const c=el('div','card');
  const h=el('div'); h.style.cssText='display:flex;gap:8px;align-items:baseline;flex-wrap:wrap';
  const code=el('span','mono',x.rule_code||x.code||'?'); code.style.color=color;
  h.appendChild(code);
  h.appendChild(el('span',null,x.what||x.reason||x.message||''));
  c.appendChild(h);
  if(x.field) c.appendChild(el('div','why','Sai ở: → '+x.field));
  if(x.fix)   c.appendChild(el('div','why','Cần sửa: → '+x.fix));
  if(x.options&&x.options.length){
    const r=el('div'); r.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:6px';
    r.appendChild(el('span','why','Chọn:'));
    x.options.slice(0,8).forEach(o=>{const b=el('button','ghost',String(o));
      b.onclick=()=>applyChoice(x.field,o); r.appendChild(b);});
    c.appendChild(r);
  } else if(x.how) c.appendChild(el('div','why','Sửa như thế nào: → '+x.how));
  const d=x.detail||x.rationale;
  if(d){ const dt=el('details'); dt.appendChild(el('summary',null,'Chi tiết / Debug'));
    dt.appendChild(el('div','why',typeof d==='string'?d:JSON.stringify(d,null,1)));
    c.appendChild(dt); }
  return c;
}
function applyChoice(field,val){
  const i=document.querySelector(`[data-k="${field}"]`)||
          document.querySelector(`[data-c="${field}"]`);
  if(!i){ $('#sub').textContent='không tìm thấy ô '+field; return; }
  i.value=String(val).replace(/^cỡ /,''); tab('cfg'); i.focus();
  $('#sub').textContent=`đã đặt ${field}=${i.value} — bấm Dựng BOM lại`;
}

function renderBom(r){
  const v=$('#v-bom'); v.innerHTML='';
  const lines=r.lines||[], gaps=r.gaps||[], warns=r.warnings||[];
  const box=el('div','stat');
  [['#35D4AA',lines.length,'dòng BOM'],
   ['#F0A947',warns.filter(w=>w.severity!=='info').length,'cảnh báo'],
   ['#F2637A',gaps.length,'cần bạn quyết']].forEach(([c,n,l])=>{
    const b=el('div','sbox'); const x=el('div','snum',String(n)); x.style.color=c;
    b.appendChild(x); b.appendChild(el('div','slab',l)); box.appendChild(b);});
  v.appendChild(box);
  if(gaps.length){ const a=el('div','alert');
    a.innerHTML=`<b>⚠ BOM chưa đầy đủ</b> — còn ${gaps.length} mục cần bạn quyết định.`;
    v.appendChild(a); }

  const info=warns.filter(w=>w.severity==='info');
  if(info.length){
    const s=el('div'); s.appendChild(el('h2',null,'Engine đã tự quyết'));
    info.forEach(w=>{const c=el('div','card');
      c.appendChild(el('div',null,'✓ '+(w.message||w.what||'')));
      if(w.rationale){const dt=el('details');
        dt.appendChild(el('summary',null,'Chi tiết / Debug'));
        dt.appendChild(el('div','why',w.rationale)); c.appendChild(dt);}
      s.appendChild(c);});
    v.appendChild(s);
  }

  const by={}; lines.forEach(l=>(by[l.layer]||=[]).push(l));
  const s=el('div'); s.appendChild(el('h2',null,'BOM theo tầng'));
  const tb=el('table');
  const th=el('thead');
  th.innerHTML='<tr><th>Thiết bị</th><th>Lý do</th><th style="text-align:right">SL</th></tr>';
  tb.appendChild(th);
  const tbody=el('tbody');
  LAYER_ORDER.forEach(L=>{
    if(!by[L]) return;
    const hr=el('tr'); const hd=el('td'); hd.colSpan=3;
    hd.style.cssText=`color:var(--l-${L});font-size:11px;font-weight:600;letter-spacing:.5px`;
    hd.textContent=LAYER_VN[L]||L; hr.appendChild(hd); tbody.appendChild(hr);
    by[L].forEach(l=>{
      const tr=el('tr');
      const c1=el('td'); c1.appendChild(el('div','mono',l.part_number));
      if(l.source==='manual') c1.appendChild(el('span','pill','nhập tay'));
      tr.appendChild(c1);
      const c2=el('td','why');
      c2.textContent=(l.rule_code?l.rule_code+': ':'')+String(l.rationale||'').slice(0,110);
      if(l.confidence!=null&&l.confidence<0.9)
        c2.appendChild(el('div','pill',`tin cậy ${Math.round(l.confidence*100)}% — kiểm lại`));
      tr.appendChild(c2);
      const c3=el('td','mono'); c3.style.textAlign='right'; c3.textContent=l.qty;
      tr.appendChild(c3); tbody.appendChild(tr);
    });
  });
  tb.appendChild(tbody); s.appendChild(tb); v.appendChild(s);

  const real=warns.filter(w=>w.severity!=='info');
  if(real.length){ const w=el('div'); w.appendChild(el('h2',null,'Cảnh báo'));
    real.forEach(x=>w.appendChild(problemCard(x,x.severity==='error'?'#F2637A':'#F0A947')));
    v.appendChild(w); }
  const gg=el('div'); gg.appendChild(el('h2',null,'Cần bạn quyết định'));
  if(!gaps.length) gg.appendChild(el('div','hint','không còn mục nào'));
  gaps.forEach(x=>gg.appendChild(problemCard(x,'#F2637A')));
  v.appendChild(gg);
}

/* ── SƠ ĐỒ: bố cục tidy-tree, KHÔNG THỂ chồng lấn ────────────────────────────
   "Không chồng lấn" được bảo đảm BẰNG CẤU TRÚC, không bằng canh tay:
     · cột theo ĐỘ SÂU; độ rộng cột = box rộng nhất TRONG cột đó
     · mỗi node LÁ chiếm một khe dọc RIÊNG; node cha nằm giữa các con
   Hai điều đó ⇒ hai node không bao giờ trùng vùng.
   Không có toạ độ nào cố định sẵn — đây đúng chỗ prototype vỡ (mainY=380 cứng,
   và hàng phụ kiện rộng 210px nhét trong cột 176px). */
const BOXH=44, VGAP=10, HGAP=48, PADX=16, PADY=16, CHARW=6.4;
function boxW(n){
  const a=(n.name||n.type||'').length, b=(n.code||'').length;
  return Math.max(126, Math.min(268, Math.round(Math.max(a,b*0.95)*CHARW)+24));
}
function layoutTree(root){
  const levels=[];
  for(const [n,,d] of walk(root)) (levels[d]||=[]).push(n);
  const colW=levels.map(l=>Math.max(...l.map(boxW)));
  const colX=[]; let x=PADX;
  colW.forEach((w,i)=>{ colX[i]=x; x+=w+HGAP; });
  const pos=new Map(); let cursor=PADY;
  (function place(n,d){
    const kids=n.children||[];
    if(!kids.length){ pos.set(n.id,{x:colX[d],y:cursor,w:colW[d]}); cursor+=BOXH+VGAP; return; }
    kids.forEach(c=>place(c,d+1));
    const ys=kids.map(c=>pos.get(c.id).y);
    pos.set(n.id,{x:colX[d],y:(Math.min(...ys)+Math.max(...ys))/2,w:colW[d]});
  })(root,0);
  return {pos,width:Math.max(x-HGAP+PADX,200),height:Math.max(cursor-VGAP+PADY,BOXH+2*PADY)};
}
function renderDiagram(){
  const v=$('#v-diagram');
  if(!TREE){ v.innerHTML='<div class="hint">chưa có cây</div>'; return; }
  const {pos,width,height}=layoutTree(TREE);
  const svg=sv('svg',{viewBox:`0 0 ${width} ${height}`,width:width,height:height,
    style:`min-width:${width}px`});
  for(const [n] of walk(TREE)){
    const a=pos.get(n.id);
    (n.children||[]).forEach(c=>{
      const b=pos.get(c.id);
      const x1=a.x+a.w, y1=a.y+BOXH/2, x2=b.x, y2=b.y+BOXH/2, mx=x1+(x2-x1)/2;
      svg.appendChild(sv('path',{d:`M${x1},${y1} H${mx} V${y2} H${x2}`,
        fill:'none',stroke:'#3A4150','stroke-width':1.5}));
    });
  }
  for(const [n] of walk(TREE)){
    const p=pos.get(n.id), L=layerOf(n.type), st=statusOf(n);
    svg.appendChild(sv('rect',{x:p.x,y:p.y,width:p.w,height:BOXH,rx:6,
      fill:'#1C202B',stroke:`var(--l-${L})`,'stroke-width':1.6,
      'stroke-dasharray': st==='specified'?'':st==='type_only'?'5,3':'2,3'}));
    const cap=Math.floor((p.w-20)/CHARW);
    const t1=sv('text',{x:p.x+10,y:p.y+18,'font-size':11,fill:'#E8EAF0','font-weight':600});
    t1.textContent=(n.name||n.type).slice(0,cap);
    svg.appendChild(t1);
    const t2=sv('text',{x:p.x+10,y:p.y+33,'font-size':10,fill:`var(--l-${L})`,
      'font-family':'monospace'});
    t2.textContent=(n.code||(st==='type_only'?'(chưa chọn mã)':'(chưa nhập)')).slice(0,cap);
    svg.appendChild(t2);
  }
  v.innerHTML='';
  v.appendChild(el('div','hint',
    'Sơ đồ sinh từ cây: cột theo cấp, mỗi lá một khe riêng — bố cục tính từ nội dung nên không chồng lấn.'));
  const w=el('div','diagwrap'); w.style.marginTop='10px';
  w.appendChild(svg); v.appendChild(w);
}

function tab(name){
  ['tree','cfg','bom','diagram'].forEach(t=>$('#v-'+t).classList.toggle('active',t===name));
  document.querySelectorAll('.tab').forEach(b=>
    b.classList.toggle('active',b.dataset.tab===name));
  if(name==='diagram') renderDiagram();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('#run').onclick=run;
$('#addStation').onclick=addStation;
$('#undo').onclick=undo;
$('#csv').onclick=()=>{ if(lastProject) location.href='/api/csv?project='+lastProject; };
addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
});
boot();
</script>
